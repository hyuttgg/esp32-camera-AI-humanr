version: '3.8'

services:
  # 1. Cơ sở dữ liệu Quan hệ MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: ocean-vision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ocean_vision}
      MYSQL_USER: ${MYSQL_USER:-ocean_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ocean_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: ocean-vision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ocean-vision-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. NestJS Backend API
  api-nest:
    build:
      context: ../../apps/api-nest
      dockerfile: Dockerfile
    container_name: ocean-vision-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 5. Python Computer Vision Worker
  vision-worker:
    build:
      context: ../../apps/vision-worker
      dockerfile: Dockerfile
    container_name: ocean-vision-vision-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 6. React + Tailwind Admin Dashboard Frontend
  web-react:
    build:
      context: ../../apps/web-ocean
      dockerfile: Dockerfile
    container_name: ocean-vision-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-nest

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

